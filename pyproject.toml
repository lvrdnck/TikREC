[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tikrec"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[project.scripts]
tikrec = "tikrec.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
