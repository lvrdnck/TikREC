[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tikrec"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[project.scripts]
tikrec = "tikrec.cli:main"

[tool.setuptools.dynamic]
version = {attr = "tikrec.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
